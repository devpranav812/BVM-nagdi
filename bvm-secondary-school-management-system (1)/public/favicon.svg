<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Subtle Inner Border -->
  <rect x="5" y="5" width="54" height="54" rx="11" fill="none" stroke="#f59e0b" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Torch / Flame of Knowledge (Top Center) -->
  <path d="M 32 10 C 34 13 36 15 35 18 C 34 20 32 21 32 21 C 32 21 30 20 29 18 C 28 15 30 13 32 10 Z" fill="url(#goldGrad)" />
  <circle cx="32" cy="18" r="1.5" fill="#fef08a" />

  <!-- Open Book of Wisdom -->
  <!-- Left Page -->
  <path d="M 31 23 C 25 21 18 22 15 24 L 15 34 C 18 32 25 31 31 33 Z" fill="url(#bookGrad)" stroke="#cbd5e1" stroke-width="0.8" />
  <!-- Right Page -->
  <path d="M 33 23 C 39 21 46 22 49 24 L 49 34 C 46 32 39 31 33 33 Z" fill="url(#bookGrad)" stroke="#cbd5e1" stroke-width="0.8" />
  <!-- Book Spine Center -->
  <path d="M 32 22.5 L 32 34" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />

  <!-- School Initials: BVM -->
  <text x="32" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="900" letter-spacing="1.5" fill="url(#goldGrad)" text-anchor="middle" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.7))">BVM</text>

  <!-- Star Accents -->
  <circle cx="12" cy="46" r="1.2" fill="#f59e0b" />
  <circle cx="52" cy="46" r="1.2" fill="#f59e0b" />

  <!-- Bottom School Ribbon Line -->
  <path d="M 16 55 L 48 55" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />
</svg>
